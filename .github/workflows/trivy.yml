name: Trivy Pipeline ellenőrzés

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Kód letöltése
      uses: actions/checkout@v4

    - name: Docker konténer felépítése
      run: docker build -t cv2-demo:latest .

    - name: Trivy biztonsági ellenőrzés
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'cv2-demo:latest'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        scanners: 'vuln,misconfig'
        severity: 'CRITICAL,HIGH'

    - name: Grype biztonsági ellenörzés
      if: always()
      uses: anchore/scan-action@v7
      with:
        image: "cv2-demo:latest"
        fail-build: true
        output-format: table
        severity-cutoff: high

          
    - name: Bejelentkezés a GitHub Container Registry-be (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Konténer feltöltése
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ghcr.io/${{ github.repository }}/cv2-demo:latest
