name: Trivy Pipeline ellenőrzés

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Kód letöltése
      uses: actions/checkout@v7

    - name: Docker konténer felépítése
      run: docker build -t cv2-demo:latest .

    - name: Trivy biztonsági ellenőrzés
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'cv2-demo:latest'
        format: 'cyclonedx'
        output: "trivy-sbom.json" 
        exit-code: '1'
        ignore-unfixed: true
        scanners: 'vuln,misconfig'
        severity: 'CRITICAL,HIGH'

    - name: Trivy sbom feltöltése artifact-ként 
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: trivy-sbom
        path: trivy-sbom.json

    - name: Grype biztonsági ellenörzés
      if: always()
      uses: anchore/scan-action@v7
      with:
        image: "cv2-demo:latest"
        fail-build: true
        output-format: table
        only-fixed: true
        severity-cutoff: high
        
    - name: SBOM generálás Syft segítségével
      if: always()
      uses: anchore/sbom-action@v0
      with:
          image: cv2-demo:latest
          format: cyclonedx-json
          output-file: syft-sbom.json
    
    - name: Syft sbom feltöltése artifact-ként 
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: syft-sbom
        path: syft-sbom.json

          
    - name: Bejelentkezés a GitHub Container Registry-be (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Konténer feltöltése
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ghcr.io/${{ github.repository }}/cv2-demo:latest
